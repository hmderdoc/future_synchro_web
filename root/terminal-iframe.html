<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    :root {
        --mi-bottom-reserved: 0px;
    }
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }
    .fTelnetContainer {
        width: 100%;
        height: calc(100% - var(--mi-bottom-reserved));
        overflow: hidden;
        position: relative;
    }
    .fTelnetClientContainer {
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
    }
    canvas {
        display: block;
        image-rendering: -moz-crisp-edges;
        image-rendering: pixelated;
    }
    .fTelnetStatusBar { display: none !important; }
    .fTelnetConnectButton { display: none !important; }
    .fTelnetKeyboardWrapper { display: none !important; }
    .fTelnetFocusWarning,
    .fTelnetFocusWarningBar { display: none !important; }
    .fTelnetScrollback { display: none !important; }
    .fTelnetMenuButton,
    .fTelnetMenuButtons { display: none !important; }
    .fTelnetInitMessage { display: none !important; }
</style>
</head>
<body>
<div id="fTelnetContainer" class="fTelnetContainer"></div>
<script src="js/ansi-music.js?_v=20260705a"></script>
<script>
(function () {
    'use strict';

    var client = null;
    var isConnected = false;
    var currentColumns = 0;
    var currentRows = 0;
    var currentSize = null;
    var clickSequence = 0;
    var tapFallbackTimer = null;
    var terminalUiBuffer = '';
    var STANDARD_TERMINAL_TYPE = 'ansi-bbs-cp437';
    var TRUECOLOR_TERMINAL_TYPE = 'ansi-bbs-cp437-truecolor';
    var TERMINAL_UI_PREFIXES = ['FLWEB/1 ', 'FLWEB:ALERT'];
    var TERMINAL_UI_MAX_BUFFER = 4096;
    var ansiMusicPlayer = window.AnsiMusic ? new window.AnsiMusic.Player() : null;
    var apcAudioPlayer = window.AnsiMusic && window.AnsiMusic.ApcPlayer
        ? new window.AnsiMusic.ApcPlayer({
            // Closed-loop feedback: the armed drain notify is how doors
            // (fl_records) detect this sink and recover from underruns.
            onNotify: function (ch) {
                sendInputToServer('\x1b[=7;' + ch + ';0n');
            }
        }) : null;
    var ansiMusicFilter = window.AnsiMusic ? new window.AnsiMusic.Filter(function (mml) {
        ansiMusicPlayer.play(mml);
    }, { onApc: function (payload) { if (apcAudioPlayer) apcAudioPlayer.feed(payload); } }) : null;

    /* fTelnet CP437 bitmap font sizes (exact PNGs, sorted largest-first).
       Same order as fTelnet's GetBestFit — this IS the contract. */
    var CP437_FONTS = [
        { w: 12, h: 23 },
        { w: 10, h: 19 },
        { w:  9, h: 16 },
        { w:  8, h: 16 },
        { w:  8, h: 14 },
        { w:  8, h: 13 },
        { w:  8, h: 12 },
        { w:  7, h: 12 },
        { w:  6, h:  8 }
    ];
    var MIN_COLS = 80, MIN_ROWS = 24, MAX_COLS = 160, MAX_ROWS = 60;
    var NAWS_MIN_INTERVAL_MS = 250;

    function getScreenSize() {
        var container = document.getElementById('fTelnetContainer');
        var rect = container ? container.getBoundingClientRect() : null;
        var W = rect && rect.width ? rect.width : window.innerWidth;
        var H = rect && rect.height ? rect.height : window.innerHeight;
        var font = CP437_FONTS[CP437_FONTS.length - 1];
        for (var i = 0; i < CP437_FONTS.length; i++) {
            var f = CP437_FONTS[i];
            if (Math.floor(W / f.w) >= MIN_COLS && Math.floor(H / f.h) >= MIN_ROWS) {
                font = f;
                break;
            }
        }
        // 1) Maximum rows, no safety subtraction
        var rows = Math.max(Math.min(Math.floor(H / font.h), MAX_ROWS), MIN_ROWS);
        // 2) Scale to fill leftover vertical pixels (cap so MIN_COLS still fits)
        var vScale = H / (rows * font.h);
        var maxScale = W / (MIN_COLS * font.w);
        var scale = Math.min(vScale, maxScale);
        // 3) Columns based on scaled font width
        var cols = Math.max(Math.min(Math.floor(W / (font.w * scale)), MAX_COLS), MIN_COLS);
        return { columns: cols, rows: rows, scale: scale, fontW: font.w, fontH: font.h };
    }

    function installScreenSizeGuard(cl, initialCols, initialRows) {
        var crt;
        var originalSetScreenSize;
        var pendingTimer = null;
        var pendingCols = 0;
        var pendingRows = 0;
        var lastCols = parseInt(initialCols, 10) || 0;
        var lastRows = parseInt(initialRows, 10) || 0;
        var lastSentAt = 0;

        if (!cl || !cl._Crt || typeof cl._Crt.SetScreenSize !== 'function') return;
        crt = cl._Crt;
        if (crt._flwebSetScreenSizeGuarded) return;

        originalSetScreenSize = crt.SetScreenSize.bind(crt);

        function apply(cols, rows) {
            cols = parseInt(cols, 10) || 0;
            rows = parseInt(rows, 10) || 0;
            if (cols < 1 || rows < 1) return false;
            if (cols === lastCols && rows === lastRows) return false;
            originalSetScreenSize(cols, rows);
            lastCols = cols;
            lastRows = rows;
            lastSentAt = Date.now();
            return true;
        }

        function schedule(cols, rows) {
            pendingCols = parseInt(cols, 10) || 0;
            pendingRows = parseInt(rows, 10) || 0;
            if (pendingCols < 1 || pendingRows < 1) return false;
            if (pendingTimer) return false;
            pendingTimer = setTimeout(function () {
                var nextCols = pendingCols;
                var nextRows = pendingRows;
                pendingTimer = null;
                pendingCols = 0;
                pendingRows = 0;
                apply(nextCols, nextRows);
            }, NAWS_MIN_INTERVAL_MS);
            return true;
        }

        crt.SetScreenSize = function (cols, rows) {
            var nextCols = parseInt(cols, 10) || 0;
            var nextRows = parseInt(rows, 10) || 0;
            var now = Date.now();

            if (nextCols < 1 || nextRows < 1) return;
            if (nextCols === lastCols && nextRows === lastRows) return;
            if (lastSentAt && (now - lastSentAt) < NAWS_MIN_INTERVAL_MS) {
                schedule(nextCols, nextRows);
                return;
            }
            apply(nextCols, nextRows);
        };

        crt._flwebSetScreenSizeGuarded = true;
        crt._flwebSetScreenSizeFlush = function () {
            var nextCols;
            var nextRows;
            if (!pendingTimer) return false;
            clearTimeout(pendingTimer);
            pendingTimer = null;
            nextCols = pendingCols;
            nextRows = pendingRows;
            pendingCols = 0;
            pendingRows = 0;
            return apply(nextCols, nextRows);
        };
    }

    function sendToParent(msg) {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage(msg, location.origin);
        }
    }

    function setNormalRLoginTerminalType(cl) {
        var terminalType = getRLoginTerminalType();
        if (cl && cl.Options && cl.Options.ConnectionType === 'rlogin') {
            cl.Options.RLoginTerminalType = terminalType;
        }
        if (cl && cl._Options && cl._Options.ConnectionType === 'rlogin') {
            cl._Options.RLoginTerminalType = terminalType;
        }
    }

    function getRLoginTerminalType() {
        return TRUECOLOR_TERMINAL_TYPE;
    }

    function installTrueColorSupport(cl) {
        var crt = cl && cl._Crt;
        var charInfo = crt && crt._CharInfo;
        var supports = false;

        if (!crt || !charInfo) {
            window._flwebTrueColor = { supported: false, reason: 'missing-crt' };
            return false;
        }

        if (typeof crt.TextColor24 !== 'function') {
            crt.TextColor24 = function (red, green, blue) {
                this._CharInfo.Fore24 =
                    ((red & 0xFF) << 16) + ((green & 0xFF) << 8) + (blue & 0xFF);
            };
        }
        if (typeof crt.TextBackground24 !== 'function') {
            crt.TextBackground24 = function (red, green, blue) {
                this._CharInfo.Back24 =
                    ((red & 0xFF) << 16) + ((green & 0xFF) << 8) + (blue & 0xFF);
            };
        }

        function normalizeSgr(match, params) {
            var tokens = String(params || '').replace(/:/g, ';').split(';').filter(function (token) {
                return token !== '';
            });
            var output = '';
            var normal = [];
            var changed = false;

            function isByte(token) {
                var value = parseInt(token, 10);
                return String(value) === String(token) && value >= 0 && value <= 255;
            }

            function flushNormal() {
                if (!normal.length) return;
                output += '\x1b[' + normal.join(';') + 'm';
                normal = [];
            }

            for (var i = 0; i < tokens.length;) {
                var code = parseInt(tokens[i], 10);
                var mode = parseInt(tokens[i + 1], 10);

                if (i + 4 < tokens.length &&
                    isByte(tokens[i]) && isByte(tokens[i + 1]) && isByte(tokens[i + 2]) &&
                    (parseInt(tokens[i + 3], 10) === 38 || parseInt(tokens[i + 3], 10) === 48) &&
                    parseInt(tokens[i + 4], 10) === 2) {
                    flushNormal();
                    output += '\x1b[' + [
                        38, 2, tokens[i], tokens[i + 1], tokens[i + 2]
                    ].join(';') + 'm';
                    i += 3;
                    changed = true;
                    continue;
                }

                if ((code === 38 || code === 48) && mode === 2 && i + 4 < tokens.length) {
                    flushNormal();
                    output += '\x1b[' + [
                        code, mode, tokens[i + 2], tokens[i + 3], tokens[i + 4]
                    ].join(';') + 'm';
                    i += 5;
                    changed = true;
                    continue;
                }

                if ((code === 38 || code === 48) && mode === 5 && i + 2 < tokens.length) {
                    flushNormal();
                    output += '\x1b[' + [code, mode, tokens[i + 2]].join(';') + 'm';
                    i += 3;
                    changed = true;
                    continue;
                }

                normal.push(tokens[i]);
                i++;
            }

            flushNormal();
            return changed ? output : match;
        }

        if (cl._Ansi && typeof cl._Ansi.Write === 'function' && !cl._Ansi._flwebTrueColorWrite) {
            var originalAnsiWrite = cl._Ansi.Write.bind(cl._Ansi);
            var pendingAnsiFragment = '';

            function normalizeAnsiText(text) {
                var combined = pendingAnsiFragment + text;
                var lastEsc = combined.lastIndexOf('\x1b[');
                var tail;

                pendingAnsiFragment = '';
                if (combined.charAt(combined.length - 1) === '\x1b') {
                    pendingAnsiFragment = '\x1b';
                    combined = combined.slice(0, -1);
                    lastEsc = combined.lastIndexOf('\x1b[');
                }
                if (lastEsc >= 0) {
                    tail = combined.slice(lastEsc + 2);
                    if (!/[\x40-\x7e]/.test(tail)) {
                        pendingAnsiFragment = combined.slice(lastEsc);
                        combined = combined.slice(0, lastEsc);
                    }
                }

                return combined.replace(/\x1b\[([0-9;:]*)m/g, normalizeSgr);
            }

            cl._Ansi.Write = function (text) {
                if (typeof text === 'string' && text.indexOf('\x1b[') >= 0) {
                    text = normalizeAnsiText(text);
                } else if (typeof text === 'string' && pendingAnsiFragment) {
                    text = normalizeAnsiText(text);
                }
                if (text === '') return;
                return originalAnsiWrite(text);
            };
            cl._Ansi._flwebTrueColorWrite = true;
        }

        if (!window._flwebSuppressFtelnetUnknownEsc) {
            var originalConsoleLog = console.log.bind(console);
            console.log = function () {
                if (arguments.length > 0 &&
                    /^Unknown ESC sequence: PB\(/.test(String(arguments[0] || ''))) {
                    return;
                }
                return originalConsoleLog.apply(console, arguments);
            };
            window._flwebSuppressFtelnetUnknownEsc = true;
        }

        try {
            var oldFore = charInfo.Fore24;
            var oldBack = charInfo.Back24;
            crt.TextColor24(1, 2, 3);
            crt.TextBackground24(4, 5, 6);
            supports = charInfo.Fore24 === 0x010203 && charInfo.Back24 === 0x040506;
            charInfo.Fore24 = oldFore;
            charInfo.Back24 = oldBack;
        } catch (err) {
            window._flwebTrueColor = {
                supported: false,
                reason: err && err.message ? err.message : String(err)
            };
            console.warn('[flweb] fTelnet truecolor probe failed:',
                window._flwebTrueColor.reason);
            return false;
        }

        window._flwebTrueColor = {
            supported: supports,
            terminalType: getRLoginTerminalType(),
            sgrNormalizer: !!(cl._Ansi && cl._Ansi._flwebTrueColorWrite),
            textColor24: typeof crt.TextColor24 === 'function',
            textBackground24: typeof crt.TextBackground24 === 'function'
        };
        console.log('[flweb] fTelnet truecolor support:',
            supports ? 'enabled' : 'unavailable',
            window._flwebTrueColor);
        return supports;
    }

    function installFtelnetFontCacheGuard(cl) {
        var font = cl && cl._Crt && cl._Crt._Font;
        var MAX_CHARS_MAPS = 48;
        var MAX_CHAR_MAPS = 4096;
        var charsLru = [];
        var charLru = [];

        if (!font || font._flwebFontCacheGuarded) return false;

        function touch(list, key) {
            var idx = list.indexOf(key);
            if (idx !== -1) list.splice(idx, 1);
            list.push(key);
        }

        function trimCache(cache, list, max) {
            var key;
            while (cache && list.length > max) {
                key = list.shift();
                delete cache[key];
            }
        }

        function getCharsKey(charInfo) {
            return font._Name + '-' + font._Size.x + '-' + font._Size.y + '-' +
                charInfo.Fore24 + '-' + charInfo.Back24 + '-' + charInfo.Reverse;
        }

        function getCharKey(charCode, charInfo) {
            return font._Name + '-' + font._Size.x + '-' + font._Size.y + '-' +
                charCode + '-' + charInfo.Fore24 + '-' + charInfo.Back24 + '-' +
                charInfo.Reverse;
        }

        if (typeof font.GetChars === 'function' && !font.GetChars._flwebGuarded) {
            var originalGetChars = font.GetChars.bind(font);
            font.GetChars = function (charInfo) {
                var key = charInfo ? getCharsKey(charInfo) : null;
                var ret = originalGetChars(charInfo);
                if (key && this._CharsMap && this._CharsMap[key]) {
                    touch(charsLru, key);
                    trimCache(this._CharsMap, charsLru, MAX_CHARS_MAPS);
                }
                return ret;
            };
            font.GetChars._flwebGuarded = true;
        }

        if (typeof font.GetChar === 'function' && !font.GetChar._flwebGuarded) {
            var originalGetChar = font.GetChar.bind(font);
            font.GetChar = function (charCode, charInfo) {
                var key = charInfo ? getCharKey(charCode, charInfo) : null;
                var ret = originalGetChar(charCode, charInfo);
                if (key && this._CharMap && this._CharMap[key]) {
                    touch(charLru, key);
                    trimCache(this._CharMap, charLru, MAX_CHAR_MAPS);
                }
                return ret;
            };
            font.GetChar._flwebGuarded = true;
        }

        font._flwebFontCacheGuarded = true;
        window._flwebFontCacheGuard = {
            charsMapLimit: MAX_CHARS_MAPS,
            charMapLimit: MAX_CHAR_MAPS,
            charsMapEntries: charsLru,
            charMapEntries: charLru
        };
        console.log('[flweb] fTelnet font cache guard installed',
            window._flwebFontCacheGuard);
        return true;
    }

    function installTrueColorFastWrite(cl) {
        var crt = cl && cl._Crt;
        var originalFastWrite;

        if (!crt || typeof crt.FastWrite !== 'function' || crt._flwebTrueColorFastWrite) {
            return false;
        }

        function isDynamicTrueColor(charInfo) {
            if (!charInfo) return false;
            if (charInfo.Reverse || charInfo.Blink || charInfo.Underline) return false;
            return charInfo.Fore24 > 0x0F || charInfo.Back24 > 0x0F;
        }

        function setCell(cell, ch, charInfo) {
            if (!cell) return;
            cell.Set(charInfo);
            cell.Ch = ch;
            cell.NeedsRedraw = false;
        }

        function drawCellRect(ctx, px, py, w, h, color) {
            ctx.fillStyle = '#' + ('000000' + (color & 0xFFFFFF).toString(16)).slice(-6);
            ctx.fillRect(px, py, w, h);
        }

        function drawFastChar(ch, x, y, charInfo, updateBuffer) {
            var ctx = crt._CanvasContext;
            var font = crt._Font;
            var fw = font && font.Width;
            var fh = font && font.Height;
            var px;
            var py;
            var fg = charInfo.Fore24 & 0xFFFFFF;
            var bg = charInfo.Back24 & 0xFFFFFF;

            if (!ctx || !fw || !fh) return false;
            px = (x - 1) * fw;
            py = (y - 1) * fh;
            if (crt._UseModernScrollback) {
                py = (y - 1 + crt._ScrollbackSize) * fh;
            } else if (crt._InScrollback && updateBuffer) {
                return true;
            }

            if (ch === ' ' || ch.charCodeAt(0) === 0) {
                drawCellRect(ctx, px, py, fw, fh, bg);
            } else if (ch === String.fromCharCode(219)) {
                drawCellRect(ctx, px, py, fw, fh, fg);
            } else if (ch === String.fromCharCode(220)) {
                drawCellRect(ctx, px, py, fw, fh, bg);
                drawCellRect(ctx, px, py + Math.floor(fh / 2), fw, Math.ceil(fh / 2), fg);
            } else if (ch === String.fromCharCode(223)) {
                drawCellRect(ctx, px, py, fw, Math.ceil(fh / 2), fg);
                drawCellRect(ctx, px, py + Math.ceil(fh / 2), fw, Math.floor(fh / 2), bg);
            } else {
                return false;
            }
            return true;
        }

        originalFastWrite = crt.FastWrite.bind(crt);
        crt.FastWrite = function (text, x, y, charInfo, updateBuffer) {
            var i;
            var ch;
            var maxLen;

            if (typeof updateBuffer === 'undefined') updateBuffer = true;
            if (!isDynamicTrueColor(charInfo) || typeof text === 'undefined' ||
                x > this._ScreenSize.x || y > this._ScreenSize.y) {
                return originalFastWrite(text, x, y, charInfo, updateBuffer);
            }

            maxLen = Math.min(String(text).length, this._ScreenSize.x - x + 1);
            for (i = 0; i < maxLen; i++) {
                ch = String(text).charAt(i);
                if (!drawFastChar(ch, x + i, y, charInfo, updateBuffer)) {
                    return originalFastWrite(text, x, y, charInfo, updateBuffer);
                }
                if (updateBuffer && this._Buffer[y] && this._Buffer[y][x + i]) {
                    setCell(this._Buffer[y][x + i], ch, charInfo);
                }
            }
        };
        crt._flwebTrueColorFastWrite = true;
        console.log('[flweb] fTelnet truecolor FastWrite fast path installed');
        return true;
    }

    function parseTerminalUiPayload(payload) {
        var prefix = 'FLWEB/1 ';
        var text;
        var packet;

        if (payload === 'FLWEB:ALERT') {
            return {
                action: 'alert',
                message: 'sent from terminal'
            };
        }

        text = String(payload || '');
        if (text.indexOf(prefix) !== 0) {
            return null;
        }

        try {
            packet = JSON.parse(text.slice(prefix.length));
        } catch (err) {
            console.warn('[flweb] invalid payload json:', err && err.message ? err.message : err);
            return null;
        }

        if (!packet || typeof packet !== 'object' || typeof packet.action !== 'string') {
            return null;
        }

        return packet;
    }

    /**
     * sendInputToServer(str) — inject raw bytes into the terminal
     * input stream (as if the user typed them). Finds fTelnet's
     * underlying WebSocket and calls .send().
     */
    function sendInputToServer(str) {
        /* Use the socket tracked by our WebSocket wrapper.
           Falls back to walking fTelnet internals if needed. */
        var socket = window._flwebServerSocket || null;
        if (!socket || socket.readyState !== 1) {
            /* Walk fTelnet internals as fallback */
            var paths = ['_Connection', '_TelnetConnection', '_RLoginConnection'];
            for (var p = 0; !socket && p < paths.length; p++) {
                try {
                    var conn = client && client[paths[p]];
                    if (conn && conn._Socket && conn._Socket.readyState === 1) {
                        socket = conn._Socket;
                    }
                } catch (_) {}
            }
        }
        if (!socket || socket.readyState !== 1) {
            console.warn('[flweb] sendInputToServer: no open socket found');
            return false;
        }
        var bytes = new Uint8Array(str.length);
        for (var i = 0; i < str.length; i++) {
            bytes[i] = str.charCodeAt(i) & 0xff;
        }
        socket.send(bytes.buffer);
        console.log('[flweb] sendInputToServer: sent', str.length, 'bytes');
        return true;
    }

    function handleBridgeProbeLocal(packet) {
        var nonce = packet && packet.nonce;
        if (!nonce) return false;

        var caps = ['radio', 'audio', 'url', 'toast', 'speech'];

        /* Build response — same APC format so the BBS can parse it.
           Using 'R' suffix: FLWEB/1R to distinguish from outbound. */
        var response = JSON.stringify({
            action: 'bridge.ack',
            nonce: String(nonce),
            caps: caps
        });
        var apc = '\x1b_FLWEB/1R ' + response + '\x1b\\';

        /* Also forward to parent so web UI can know bridge is active */
        sendToParent({
            type: 'terminal-ui',
            action: packet.action,
            message: null,
            payload: packet
        });

        return sendInputToServer(apc);
    }

    function dispatchTerminalUiPayload(payload) {
        var packet = parseTerminalUiPayload(payload);
        if (!packet) return false;

        /* bridge.probe is handled locally in the iframe —
           we send the response directly through the WebSocket
           back to the BBS as terminal input. */
        if (packet.action === 'bridge.probe') {
            return handleBridgeProbeLocal(packet);
        }

        sendToParent({
            type: 'terminal-ui',
            action: packet.action,
            message: packet.message || null,
            payload: packet
        });
        return true;
    }

    function filterTerminalUiOutput(str) {
        var input = terminalUiBuffer + String(str || '');
        var output = '';
        var start = -1;
        var end = -1;
        var cursor = 0;
        var payload = '';

        terminalUiBuffer = '';

        function couldBeTerminalUiPayload(text) {
            for (var i = 0; i < TERMINAL_UI_PREFIXES.length; i++) {
                if (TERMINAL_UI_PREFIXES[i].indexOf(text) === 0 ||
                    text.indexOf(TERMINAL_UI_PREFIXES[i]) === 0) {
                    return true;
                }
            }
            return false;
        }

        while ((start = input.indexOf('\x1b_', cursor)) !== -1) {
            output += input.slice(cursor, start);
            end = input.indexOf('\x1b\\', start + 2);
            if (end === -1) {
                payload = input.slice(start + 2);
                if (!couldBeTerminalUiPayload(payload) ||
                    payload.length > TERMINAL_UI_MAX_BUFFER) {
                    output += input.slice(start, start + 2);
                    cursor = start + 2;
                    continue;
                }
                terminalUiBuffer = input.slice(start);
                return output;
            }

            payload = input.slice(start + 2, end);
            if (!dispatchTerminalUiPayload(payload)) {
                output += input.slice(start, end + 2);
            }
            cursor = end + 2;
        }

        output += input.slice(cursor);
        return output;
    }

    function installTerminalUiBridge() {
        var ansi;
        var origWrite;

        if (!client || !client._Ansi || typeof client._Ansi.Write !== 'function') {
            return false;
        }

        ansi = client._Ansi;
        if (ansi._flwebBridgeInstalled) {
            return true;
        }

        origWrite = ansi.Write;
        ansi.Write = function (str) {
            var filtered = filterTerminalUiOutput(str);
            if (ansiMusicFilter) filtered = ansiMusicFilter.feed(filtered);
            if (!filtered.length) {
                return;
            }
            return origWrite.call(ansi, filtered);
        };
        ansi._flwebBridgeInstalled = true;
        return true;
    }

    function bytesToString(bytes) {
        var out = '';
        var i;

        for (i = 0; i < bytes.length; i += 1) {
            out += String.fromCharCode(bytes[i]);
        }
        return out;
    }

    function bytesContainTerminalUiOpen(bytes) {
        var i;
        for (i = 0; i < bytes.length - 1; i += 1) {
            if (bytes[i] === 0x1b && bytes[i + 1] === 0x5f) {
                return true;
            }

                var ms = (performance.now() - t0).toFixed(1);
                console.log('[fTelnet-speed] fast-forward done: ' +
                    avail + 'B in ' + ms + 'ms');
            }

            /* Expose for the message handler outside this IIFE */
            cl._panelSetHidden = function (hidden) {
                panelHidden = hidden;
            };
            cl._panelFastForward = function () {
                panelHidden = false;
                fastForwardDrain();
            };

            /* Use queueMicrotask for continuation (faster than
               MessageChannel and not subject to setTimeout clamping). */
            var continuationPending = false;
            function scheduleContinuation() {
                if (continuationPending) return;
                continuationPending = true;
                if (typeof queueMicrotask === 'function') {
                    queueMicrotask(doContinuation);
                } else {
                    Promise.resolve().then(doContinuation);
                }
            }
            function doContinuation() {
                continuationPending = false;
                if (panelHidden) return;   /* Fix F */
                if (cl._Connection && cl._Connection.bytesAvailable > 0) {
                    drainBuffer();
                }
            }

            cl.OnConnectionData = function () {
                if (panelHidden) return;   /* Fix F: accumulate */
                drainBuffer();
                if (cl._Connection && cl._Connection.bytesAvailable > 0) {
                    scheduleContinuation();
                }
            };

            /* ---- Fix B: Active rAF render loop ---- */
            /* Instead of an empty keepalive, the rAF loop now:
               1. Flushes any NeedsRedraw cells (catches font-load stragglers)
               2. Checks for un-drained data (safety net if ondata missed)
               3. Keeps the compositor ticking for canvas updates        */
            var rafRunning = false;
            var rafPaused  = false;
            function renderTick() {
                if (rafPaused) { rafRunning = false; return; }
                rafRunning = true;
                if (!panelHidden) {   /* Fix F: skip work while hidden */
                    /* (1) Sweep stranded NeedsRedraw cells */
                    flushNeedsRedraw();
                    /* (2) Safety-net drain: if data is sitting in the buffer
                           but ondata somehow didn't fire, process it now */
                    if (cl._Connection && cl._Connection.connected &&
                        cl._Connection.bytesAvailable > 0) {
                        drainBuffer();
                    }
                }
                requestAnimationFrame(renderTick);
            }
            function ensureRAF() {
                if (!rafRunning && !rafPaused) {
                    requestAnimationFrame(renderTick);
                }
            }
            function startRAF() {
                var c = document.querySelector('#fTelnetContainer canvas');
                if (c) {
                    ensureRAF();
                    console.log('[fTelnet-speed] active render loop started');
                    return true;
                }
                return false;
            }
            if (!startRAF()) {
                var waitForCanvas = setInterval(function () {
                    if (startRAF()) clearInterval(waitForCanvas);
                }, 100);
                setTimeout(function () { clearInterval(waitForCanvas); }, 10000);
            }

            /* ---- Fix C: NeedsRedraw flush on blink timer ---- */
            if (cl._Crt && cl._Crt._Cursor) {
                var origOnBlinkShow = cl._Crt.OnBlinkShow.bind(cl._Crt);
                cl._Crt.OnBlinkShow = function () {
                    origOnBlinkShow();
                    flushNeedsRedraw();
                };
                console.log('[fTelnet-speed] NeedsRedraw blink-flush installed');
            }

            /* ---- Fix D: Visibility-change handler ---- */
            /* When the tab/iframe becomes visible after being hidden,
               the browser may have throttled rAF and compositing.
               Force a full sweep and restart the render loop. */
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    rafPaused = true;
                    /* rAF will self-stop on next tick */
                } else {
                    rafPaused = false;
                    /* Restart render loop and force-flush everything */
                    ensureRAF();
                    flushNeedsRedraw();
                    /* Also drain any data that arrived while hidden */
                    if (cl._Connection && cl._Connection.connected &&
                        cl._Connection.bytesAvailable > 0) {
                        drainBuffer();
                    }
                }
            });

            /* ---- Fix E: Safety-net data poll ---- */
            /* Every 50ms, check if data is stranded in the buffer.
               This catches edge cases where the WebSocket ondata event
               didn't fire (e.g. rapid reconnect, browser throttling). */
            setInterval(function () {
                if (panelHidden) return;   /* Fix F */
                if (cl._Connection && cl._Connection.connected &&
                    cl._Connection.bytesAvailable > 0) {
                    drainBuffer();
                }
                /* Also sweep NeedsRedraw in case font just finished loading */
                flushNeedsRedraw();
            }, 50);

        })(client);

        if (client.OnConnectionConnect) {
            var origConnect = client.OnConnectionConnect;
            client.OnConnectionConnect = function () {
                isConnected = true;
                sendToParent({ type: 'status', connected: true });
                if (origConnect) origConnect.apply(this, arguments);
                scrollToBottom();
                setTimeout(scrollToBottom, 200);
                setTimeout(scrollToBottom, 1000);
            };
        }
        if (client.OnConnectionClose) {
            var origClose = client.OnConnectionClose;
            client.OnConnectionClose = function () {
                if (ansiMusicPlayer) ansiMusicPlayer.stop();
                if (apcAudioPlayer) apcAudioPlayer.stop();
                if (ansiMusicFilter) ansiMusicFilter.reset();
                isConnected = false;
                sendToParent({ type: 'status', connected: false });
                if (origClose) origClose.apply(this, arguments);
            };
        }

        client.Connect();
        var container = document.getElementById('fTelnetContainer');
        if (container) attachInputHandlers(container);
        forceFontRecalc();
        [150, 600, 1300].forEach(function (ms) {
            setTimeout(function () { applyCanvasScale(currentSize); }, ms);
        });
        setTimeout(repositionMobileControls, 50);
        sendToParent({ type: 'ready' });
    }

    document.addEventListener('click', function () {
        if (ansiMusicPlayer) ansiMusicPlayer.unlock();
        if (apcAudioPlayer) apcAudioPlayer.unlock();
        clickSequence += 1;
        sendToParent({ type: 'click' });
    });
    window.addEventListener('keydown', function () {
        if (ansiMusicPlayer) ansiMusicPlayer.unlock();
        if (apcAudioPlayer) apcAudioPlayer.unlock();
    }, { once: true });

    window.addEventListener('message', function (e) {
        if (e.origin !== location.origin) return;
        var msg = e.data;
        if (!msg || !msg.cmd) return;

        switch (msg.cmd) {
            case 'init':
                var script = document.createElement('script');
                script.id = 'fTelnetScript';
                script.src = msg.config.ftelnetUrl;
                script.onload = function () { initTerminal(msg.config); };
                script.onerror = function () {
                    sendToParent({ type: 'error',
                        message: 'Failed to load fTelnet script' });
                };
                document.head.appendChild(script);
                break;

            case 'connect':
                if (client) {
                    setNormalRLoginTerminalType(client);
                    try { client.Connect(); } catch (ex) {}
                }
                break;

            case 'disconnect':
                if (client) {
                    try { client.Disconnect(msg.force !== false); } catch (ex) {}
                }
                break;

            case 'rlogin':
                if (!client || !client.Options) break;
                if (isConnected) {
                    try { client.Disconnect(); } catch (ex) {}
                }
                client.Options.ConnectionType = 'rlogin';
                client.Options.RLoginClientUsername = msg.password;
                client.Options.RLoginServerUsername = msg.username;
                client.Options.RLoginTerminalType = getRLoginTerminalType();
                if (client._Options) {
                    client._Options.RLoginTerminalType = getRLoginTerminalType();
                }
                if (msg.isSecure) {
                    client.Options.WebSocketUrlPath =
                        '/ws?Port=' + msg.rloginPort;
                } else {
                    client.Options.WebSocketUrlPath =
                        '?Port=' + msg.rloginPort;
                }
                client.Connect();
                break;

            case 'xtrn':
                if (!client) break;
                if (isConnected) {
                    try { client.Disconnect(false); } catch (ex) {}
                }
                client._Options.RLoginTerminalType = 'xtrn=' + msg.code;
                client.Connect();
                break;

            case 'logout':
                if (ansiMusicPlayer) ansiMusicPlayer.stop();
                if (apcAudioPlayer) apcAudioPlayer.stop();
                if (ansiMusicFilter) ansiMusicFilter.reset();
                if (client && isConnected) {
                    try { client.Disconnect(); } catch (ex) {}
                }
                if (client && client.Options) {
                    client.Options.ConnectionType = 'telnet';
                    if (msg.isSecure) {
                        client.Options.WebSocketUrlPath =
                            '/ws?Port=' + msg.telnetPort;
                    } else {
                        client.Options.WebSocketUrlPath =
                            '?Port=' + msg.telnetPort;
                    }
                }
                isConnected = false;
                sendToParent({ type: 'status', connected: false });
                break;

            case 'resize':
                if (!client || !client._Crt) break;
                var cc = document.querySelector('.fTelnetClientContainer');
                if (cc) {
                    cc.style.width = '';
                    cc.style.height = '';
                    cc.style.overflow = 'hidden';
                }
                if (typeof client._Crt.SetFont === 'function') {
                    client._Crt.SetFont(client._Crt.Font
                        ? client._Crt.Font.Name : 'CP437');
                }
                scrollToBottom();
                var newSize = getScreenSize();
                currentSize = newSize;
                if (isConnected &&
                    (newSize.columns !== currentColumns ||
                     newSize.rows !== currentRows)) {
                    currentColumns = newSize.columns;
                    currentRows = newSize.rows;
                    if (typeof client._Crt.SetScreenSize === 'function') {
                        client._Crt.SetScreenSize(currentColumns, currentRows);
                    }
                    if (typeof client._Crt.SetFont === 'function') {
                        client._Crt.SetFont(client._Crt.Font
                            ? client._Crt.Font.Name : 'CP437');
                    }
                }
                scrollToBottom();
                setTimeout(function () { applyCanvasScale(currentSize); }, 200);
                setTimeout(repositionMobileControls, 250);
                break;

            case 'refit':
                forceFontRecalc();
                break;

            case 'focus':
                if (client && client._panelFastForward) {
                    client._panelFastForward();
                }
                focusTerminal();
                break;

            case 'blur':
                if (client && client._panelSetHidden) {
                    client._panelSetHidden(true);
                }
                blurTerminal();
                break;
        }
    });

    sendToParent({ type: 'loaded' });
})();
</script>
<script src="js/mobile-input.js"></script>
</body>
</html>
