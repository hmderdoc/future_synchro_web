<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>ANSI Editor Test</title>
<style>
body { background: #1e1e2e; margin: 0; padding: 0; }
#editor-container { width: 100vw; height: 100vh; }
</style>
</head><body>
<div id="editor-container"></div>
<script src="dist/ansi-editor.js"></script>
<script>
(async function() {
    var container = document.getElementById('editor-container');
    var editor = await AnsiEditor.create({
        container: container,
        columns: 80,
        rows: 25,
        fontUrl: 'fonts/IBM VGA.F16',
        onDone: function(data) { console.log('Done:', data.length, 'bytes'); },
        onCancel: function() { console.log('Cancel'); },
    });
    window.editor = editor;
    console.log('Editor ready');
})();
</script>
</body></html>
